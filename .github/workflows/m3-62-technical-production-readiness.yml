name: M3.62 Technical Production Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3-62-technical-production-readiness.yml"
      - "src/morva/runtime/production_promotion_gate.py"
      - "src/morva/runtime/production_promotion_verifier.py"
      - "src/morva/runtime/technical_readiness_gate.py"
      - "tests/test_production_promotion_gate_m3_59.py"
      - "tests/test_production_promotion_verifier_m3_60.py"
      - "tests/test_technical_readiness_gate_m3_62.py"
      - "tools/m3_62_technical_readiness_gate.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-62-technical-production-readiness.yml"
      - "src/morva/runtime/production_promotion_gate.py"
      - "src/morva/runtime/production_promotion_verifier.py"
      - "src/morva/runtime/technical_readiness_gate.py"
      - "tests/test_production_promotion_gate_m3_59.py"
      - "tests/test_production_promotion_verifier_m3_60.py"
      - "tests/test_technical_readiness_gate_m3_62.py"
      - "tools/m3_62_technical_readiness_gate.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: Verify technical production readiness evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/technical_readiness_gate.py
          src/morva/runtime/production_promotion_verifier.py
          src/morva/runtime/production_promotion_gate.py
          tools/m3_62_technical_readiness_gate.py
          tests/test_technical_readiness_gate_m3_62.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_technical_readiness_gate_m3_62.py
          tests/test_production_promotion_verifier_m3_60.py
          tests/test_production_promotion_gate_m3_59.py
      - name: Confirm no production mutation
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|'
          pattern+='helm (install|upgrade|rollback)|terraform (apply|destroy)|'
          pattern+='gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden production mutation found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.62 is a technical evidence gate only." >> "$GITHUB_STEP_SUMMARY"
          echo "No release or deployment mutation is performed." >> "$GITHUB_STEP_SUMMARY"
          echo "Infrastructure mutation is also forbidden." >> "$GITHUB_STEP_SUMMARY"
