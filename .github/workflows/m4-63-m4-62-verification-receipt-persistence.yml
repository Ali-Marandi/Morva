name: M4.63 M4.62 Verification Receipt Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-63-m4-62-verification-receipt-persistence.yml"
      - "alembic/versions/0046_independent_m4_61_verification_receipts_m4_63.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_60_receipt_history_integrity_m4_61.py"
      - "src/morva/persistence/independent_historical_m4_58_receipt_history_verification_m4_60.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/runtime/independent_historical_m4_61_receipt_history_verifier_m4_62.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verifier_m4_62.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-63-m4-62-verification-receipt-persistence.yml"
      - "alembic/versions/0046_independent_m4_61_verification_receipts_m4_63.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_60_receipt_history_integrity_m4_61.py"
      - "src/morva/persistence/independent_historical_m4_58_receipt_history_verification_m4_60.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/runtime/independent_historical_m4_61_receipt_history_verifier_m4_62.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verifier_m4_62.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.63-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-62-verification-receipt-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py
          src/morva/runtime/independent_historical_m4_61_receipt_history_verifier_m4_62.py
          tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py
          tests/test_independent_historical_m4_61_receipt_history_verifier_m4_62.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py
          tests/test_independent_historical_m4_61_receipt_history_verifier_m4_62.py
          tests/test_historical_m4_60_receipt_history_integrity_m4_61.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_63.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.63 persists M4.62 independent M4.61 receipt-history verification results with append-only, fingerprint-idempotent receipts and source/snapshot re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
