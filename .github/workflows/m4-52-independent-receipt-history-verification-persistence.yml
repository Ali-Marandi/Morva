name: M4.52 Independent Receipt-History Verification Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-52-independent-receipt-history-verification-persistence.yml"
      - "alembic/versions/0039_independent_receipt_history_verification_m4_52.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-52-independent-receipt-history-verification-persistence.yml"
      - "alembic/versions/0039_independent_receipt_history_verification_m4_52.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.52-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-receipt-history-verification-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py
          src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py
          tests/test_independent_historical_verification_receipt_history_integrity_m4_52.py
          tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_verification_receipt_history_integrity_m4_52.py
          tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py
          tests/test_historical_independent_verification_receipt_history_integrity_m4_50.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_52.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.52 persists M4.51 independent receipt-history verification results with append-only, fingerprint-idempotent storage and source re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
