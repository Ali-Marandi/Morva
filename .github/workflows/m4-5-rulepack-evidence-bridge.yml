name: M4.5 Rule-Pack Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-5-rulepack-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/rules/rule_pack_1405_evidence.py"
      - "src/morva/rules/rule_pack_evidence_bridge.py"
      - "tests/test_rule_pack_evidence_bridge_m4_5.py"
      - "docs/M4_5_RULEPACK_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-5-rulepack-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/rules/rule_pack_1405_evidence.py"
      - "src/morva/rules/rule_pack_evidence_bridge.py"
      - "tests/test_rule_pack_evidence_bridge_m4_5.py"
      - "docs/M4_5_RULEPACK_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/rule_pack_evidence_bridge.py
          tests/test_rule_pack_evidence_bridge_m4_5.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_rule_pack_evidence_bridge_m4_5.py
      - name: Boundary
        run: |
          echo "M4.5 binds Rule Pack 1405 evidence to accepted authoritative legal evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No statutory numeric rate or production activation is introduced." >> "$GITHUB_STEP_SUMMARY"
