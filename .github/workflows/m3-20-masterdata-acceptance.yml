name: M3.20 Master Data Acceptance Drift

on:
  pull_request:
    paths:
      - "src/morva/masterdata/**"
      - "src/morva/api/v1/masterdata_acceptance.py"
      - "tests/test_masterdata_acceptance.py"
      - "tests/test_masterdata_drift.py"
      - ".github/workflows/m3-20-masterdata-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/morva/masterdata/**"
      - "src/morva/api/v1/masterdata_acceptance.py"
      - "tests/test_masterdata_acceptance.py"
      - "tests/test_masterdata_drift.py"
      - ".github/workflows/m3-20-masterdata-acceptance.yml"

permissions:
  contents: read

jobs:
  masterdata-acceptance:
    name: Master-data acceptance and drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >-
          ruff check
          src/morva/masterdata
          src/morva/api/v1/masterdata_acceptance.py
          tests/test_masterdata_acceptance.py
          tests/test_masterdata_drift.py
      - name: Acceptance and drift tests
        run: pytest -q tests/test_masterdata_acceptance.py tests/test_masterdata_drift.py
      - name: Compile application
        run: python -m compileall -q src tests
