name: M3.84 Integration Execution Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3-84-integration-execution-evidence.yml"
      - "src/morva/runtime/integration_execution_evidence.py"
      - "src/morva/runtime/official_adapter_evidence.py"
      - "tests/test_integration_execution_evidence_m3_84.py"
      - "tools/m3_84_integration_execution_evidence.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-84-integration-execution-evidence.yml"
      - "src/morva/runtime/integration_execution_evidence.py"
      - "src/morva/runtime/official_adapter_evidence.py"
      - "tests/test_integration_execution_evidence_m3_84.py"
      - "tools/m3_84_integration_execution_evidence.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Verify integration execution evidence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/runtime/integration_execution_evidence.py src/morva/runtime/official_adapter_evidence.py tools/m3_84_integration_execution_evidence.py tests/test_integration_execution_evidence_m3_84.py
      - run: pytest -q tests/test_integration_execution_evidence_m3_84.py
      - name: Record boundary
        run: |
          echo "M3.84 records staging/pilot execution evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No provider endpoint, credential or production deployment is activated." >> "$GITHUB_STEP_SUMMARY"
