name: M3.88 Independent Integration Execution Readiness Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3-88-independent-integration-execution-readiness-verifier.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier.py"
      - "src/morva/runtime/integration_execution_readiness_gate.py"
      - "src/morva/runtime/independent_integration_execution_verifier.py"
      - "src/morva/runtime/integration_execution_evidence.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m3_88.py"
      - "tests/test_integration_execution_readiness_gate_m3_86.py"
      - "tools/m3_88_independent_integration_execution_readiness_verifier.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-88-independent-integration-execution-readiness-verifier.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier.py"
      - "src/morva/runtime/integration_execution_readiness_gate.py"
      - "src/morva/runtime/independent_integration_execution_verifier.py"
      - "src/morva/runtime/integration_execution_evidence.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m3_88.py"
      - "tests/test_integration_execution_readiness_gate_m3_86.py"
      - "tools/m3_88_independent_integration_execution_readiness_verifier.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_integration_execution_readiness_verifier.py
          src/morva/runtime/integration_execution_readiness_gate.py
          src/morva/runtime/independent_integration_execution_verifier.py
          src/morva/runtime/integration_execution_evidence.py
          tests/test_independent_integration_execution_readiness_verifier_m3_88.py
          tools/m3_88_independent_integration_execution_readiness_verifier.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_integration_execution_readiness_verifier_m3_88.py
          tests/test_integration_execution_readiness_gate_m3_86.py
          tests/test_independent_integration_execution_verifier_m3_85.py
      - name: Record boundary
        run: |
          echo "M3.88 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "No adapter endpoint, credential or production deployment is activated." >> "$GITHUB_STEP_SUMMARY"
