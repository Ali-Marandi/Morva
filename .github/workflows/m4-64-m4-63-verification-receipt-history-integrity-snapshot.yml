name: M4.64 M4.63 Receipt-History Integrity Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-64-m4-63-verification-receipt-history-integrity-snapshot.yml"
      - "alembic/versions/0047_historical_m4_63_receipt_history_integrity.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/runtime/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "tests/test_historical_m4_63_receipt_history_integrity_m4_64.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-64-m4-63-verification-receipt-history-integrity-snapshot.yml"
      - "alembic/versions/0047_historical_m4_63_receipt_history_integrity.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/runtime/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "tests/test_historical_m4_63_receipt_history_integrity_m4_64.py"
      - "tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-63-receipt-history-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py
          src/morva/runtime/historical_m4_63_receipt_history_integrity_m4_64.py
          tests/test_historical_m4_63_receipt_history_integrity_m4_64.py
          tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_63_receipt_history_integrity_m4_64.py
          tests/test_independent_historical_m4_61_receipt_history_verification_m4_63.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_64.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.64 snapshots the point-in-time M4.63 independent verification receipt history with deterministic integrity fingerprints and source re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
