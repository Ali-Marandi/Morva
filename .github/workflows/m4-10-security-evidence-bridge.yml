name: M4.10 Security Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-10-security-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/security_assessment.py"
      - "src/morva/runtime/security_evidence_bridge.py"
      - "tests/test_security_evidence_bridge_m4_10.py"
      - "docs/M4_10_SECURITY_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-10-security-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/security_assessment.py"
      - "src/morva/runtime/security_evidence_bridge.py"
      - "tests/test_security_evidence_bridge_m4_10.py"
      - "docs/M4_10_SECURITY_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/security_evidence_bridge.py
          tests/test_security_evidence_bridge_m4_10.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_security_evidence_bridge_m4_10.py
      - name: Boundary
        run: |
          echo "M4.10 binds independent security assessment evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No external security assessment is executed by CI." >> "$GITHUB_STEP_SUMMARY"
