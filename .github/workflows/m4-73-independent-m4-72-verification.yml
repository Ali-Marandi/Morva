name: M4.73 Independent M4.72 Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-73-independent-m4-72-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_71_verification_history_integrity_m4_72.py"
      - "src/morva/persistence/independent_historical_m4_69_verification_receipts_m4_71.py"
      - "src/morva/runtime/independent_historical_m4_71_verification_history_integrity_m4_73.py"
      - "tests/test_historical_m4_71_verification_history_integrity_m4_72.py"
      - "tests/test_independent_historical_m4_71_verification_history_integrity_m4_73.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-73-independent-m4-72-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_71_verification_history_integrity_m4_72.py"
      - "src/morva/persistence/independent_historical_m4_69_verification_receipts_m4_71.py"
      - "src/morva/runtime/independent_historical_m4_71_verification_history_integrity_m4_73.py"
      - "tests/test_historical_m4_71_verification_history_integrity_m4_72.py"
      - "tests/test_independent_historical_m4_71_verification_history_integrity_m4_73.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_71_verification_history_integrity_m4_73.py
          tests/test_independent_historical_m4_71_verification_history_integrity_m4_73.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_71_verification_history_integrity_m4_72.py
          tests/test_independent_historical_m4_71_verification_history_integrity_m4_73.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_73.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.73 independently reconstructs and verifies M4.72 verification-receipt history integrity snapshots." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
