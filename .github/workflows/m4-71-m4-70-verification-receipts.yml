name: M4.71 M4.70 Verification Receipts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-71-m4-70-verification-receipts.yml"
      - "alembic/versions/0050_historical_m4_68_verification_history_integrity_m4_69.py"
      - "alembic/versions/0051_independent_m4_69_verification_receipts_m4_71.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/persistence/independent_historical_m4_69_verification_receipts_m4_71.py"
      - "src/morva/runtime/independent_historical_m4_69_verification_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
      - "tests/test_independent_historical_m4_69_verification_m4_70.py"
      - "tests/test_independent_historical_m4_69_verification_receipts_m4_71.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-71-m4-70-verification-receipts.yml"
      - "alembic/versions/0050_historical_m4_68_verification_history_integrity_m4_69.py"
      - "alembic/versions/0051_independent_m4_69_verification_receipts_m4_71.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/persistence/independent_historical_m4_69_verification_receipts_m4_71.py"
      - "src/morva/runtime/independent_historical_m4_68_verification_history_integrity_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
      - "tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py"
      - "tests/test_independent_historical_m4_69_verification_receipts_m4_71.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.71-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_69_verification_receipts_m4_71.py
          src/morva/runtime/independent_historical_m4_68_verification_history_integrity_m4_70.py
          tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py
          tests/test_independent_historical_m4_69_verification_receipts_m4_71.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_68_verification_history_integrity_m4_69.py
          tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py
          tests/test_independent_historical_m4_69_verification_receipts_m4_71.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_71.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.71 persists independent M4.70 verification results as append-only fingerprint-idempotent receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
