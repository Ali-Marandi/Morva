name: M3.78 Independent Official Adapter Activation Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Independently verify adapter activation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >
          ruff check
          src/morva/runtime/adapter_activation_gate.py
          src/morva/runtime/official_adapter_evidence.py
          src/morva/runtime/independent_adapter_evidence_verifier.py
          src/morva/runtime/independent_adapter_activation_verifier.py
          tests/test_independent_adapter_activation_verifier_m3_78.py
      - run: >
          pytest -q tests/test_independent_adapter_activation_verifier_m3_78.py
      - name: Record production boundary
        run: |
          echo "M3.78 is verification-only; it does not activate any external adapter." >> "$GITHUB_STEP_SUMMARY"
