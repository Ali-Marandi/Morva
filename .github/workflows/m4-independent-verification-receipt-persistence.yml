name: M4.46 Independent Verification Receipt Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-verification-receipt-persistence.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "alembic/versions/0034_historical_freshness_chain_verification_receipts.py"
      - "alembic/versions/0035_independent_historical_freshness_receipt_verifications.py"
      - "src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py"
      - "src/morva/persistence/independent_historical_freshness_receipt_verifications_m4_46.py"
      - "src/morva/runtime/historical_freshness_chain_verifier_m4_43.py"
      - "src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py"
      - "tests/test_independent_historical_freshness_receipt_verifications_m4_46.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-verification-receipt-persistence.yml"
      - "alembic/versions/0034_historical_freshness_chain_verification_receipts.py"
      - "alembic/versions/0035_independent_historical_freshness_receipt_verifications.py"
      - "src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py"
      - "src/morva/persistence/independent_historical_freshness_receipt_verifications_m4_46.py"
      - "src/morva/runtime/historical_freshness_chain_verifier_m4_43.py"
      - "src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py"
      - "tests/test_independent_historical_freshness_receipt_verifications_m4_46.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/persistence/independent_historical_freshness_receipt_verifications_m4_46.py
          src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py
          src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py
          tests/test_independent_historical_freshness_receipt_verifications_m4_46.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_freshness_receipt_verifications_m4_46.py
          tests/test_independent_historical_freshness_chain_verification_receipt_m4_45.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_46.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.46 persists the M4.45 independent verification result as write-once evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification receipt persistence remains governance/readiness metadata only." >> "$GITHUB_STEP_SUMMARY"
