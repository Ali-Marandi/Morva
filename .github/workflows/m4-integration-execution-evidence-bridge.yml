name: M4 Integration Execution Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-integration-execution-evidence-bridge.yml"
      - "src/morva/runtime/integration_execution_evidence_bridge.py"
      - "src/morva/runtime/integration_execution_readiness_gate.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_integration_execution_evidence_bridge.py"
      - "docs/M4_INTEGRATION_EXECUTION_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-integration-execution-evidence-bridge.yml"
      - "src/morva/runtime/integration_execution_evidence_bridge.py"
      - "src/morva/runtime/integration_execution_readiness_gate.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_integration_execution_evidence_bridge.py"
      - "docs/M4_INTEGRATION_EXECUTION_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/integration_execution_evidence_bridge.py
          tests/test_integration_execution_evidence_bridge.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_integration_execution_evidence_bridge.py
      - name: Boundary
        run: |
          echo "M4 integration execution bridge consumes verified M3.86 evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No provider activation, credential use or production mutation is introduced." >> "$GITHUB_STEP_SUMMARY"
