name: M4.77 M4.76 Verification-Receipt History Integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-77-m4-76-verification-receipt-history-integrity.yml"
      - "alembic/versions/0054_historical_m4_72_verification_receipt_m4_75.py"
      - "alembic/versions/0055_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "tests/test_historical_m4_72_verification_receipt_m4_75.py"
      - "tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-77-m4-76-verification-receipt-history-integrity.yml"
      - "alembic/versions/0054_historical_m4_72_verification_receipt_m4_75.py"
      - "alembic/versions/0055_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "tests/test_historical_m4_72_verification_receipt_m4_75.py"
      - "tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-history-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py
          src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py
          tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_72_verification_receipt_m4_75.py
          tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_77.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.77 captures deterministic point-in-time integrity snapshots over persisted M4.76 verification results." >> "${{GITHUB_STEP_SUMMARY}}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${{GITHUB_STEP_SUMMARY}}"
