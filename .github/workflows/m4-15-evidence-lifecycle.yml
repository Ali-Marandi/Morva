name: M4.15 Evidence Lifecycle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-15-evidence-lifecycle.yml"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "docs/M4_15_EVIDENCE_LIFECYCLE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-15-evidence-lifecycle.yml"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "docs/M4_15_EVIDENCE_LIFECYCLE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/evidence_lifecycle.py
          tests/test_evidence_lifecycle_m4_15.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_lifecycle_m4_15.py
      - name: Migration
        run: alembic upgrade head
