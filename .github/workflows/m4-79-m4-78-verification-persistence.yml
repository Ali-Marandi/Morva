name: M4.79 Independent M4.78 Verification Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-79-m4-78-verification-persistence.yml"
      - "alembic/versions/0056_independent_m4_75_verification_receipt_history_integrity_m4_79.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py"
  pull_request:
    branches:
      - main
      - feat/m4-73-m4-72-independent-verification
    paths:
      - ".github/workflows/m4-79-m4-78-verification-persistence.yml"
      - "alembic/versions/0056_independent_m4_75_verification_receipt_history_integrity_m4_79.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.79-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/persistence/independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py
          src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py
          tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_79.py
          tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_79.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.79 persists M4.78 independent verification results as append-only fingerprint-idempotent records with point-in-time M4.76 source re-verification." >> "\${GITHUB_STEP_SUMMARY}"
          echo "Verification/readiness-only; no provider execution, credentials, payment mutation or production authorization." >> "\${GITHUB_STEP_SUMMARY}"
