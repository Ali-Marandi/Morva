name: M3.15 Employee Self-Service Case Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m3-15-self-service-case-gate:
    name: M3.15 self-service, objection/case and PDF gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/api/v1/self_service.py src/morva/api/v1/cases.py src/morva/persistence/domain_extensions.py tests/test_m3_15_self_service_cases.py
      - run: pytest -q tests/test_m3_15_self_service_cases.py
