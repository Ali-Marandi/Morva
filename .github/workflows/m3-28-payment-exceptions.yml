name: M3.28 Payment Exceptions Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/morva/payroll/payment_exceptions.py'
      - 'tests/test_payment_exceptions_m3_28.py'
      - '.github/workflows/m3-28-payment-exceptions.yml'
  pull_request:
    paths:
      - 'src/morva/payroll/payment_exceptions.py'
      - 'tests/test_payment_exceptions_m3_28.py'
      - '.github/workflows/m3-28-payment-exceptions.yml'

jobs:
  m3-28-payment-exceptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/payroll/payment_exceptions.py tests/test_payment_exceptions_m3_28.py
      - run: pytest -q tests/test_payment_exceptions_m3_28.py
