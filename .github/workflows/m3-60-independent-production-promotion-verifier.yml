name: M3.60 Independent Production Promotion Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Verify production promotion evidence independently
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/production_promotion_verifier.py
          src/morva/runtime/production_promotion_gate.py
          src/morva/runtime/deployment_evidence_bundle.py
          src/morva/runtime/deployment_evidence_verifier.py
          src/morva/runtime/release_deployment_evidence.py
          tools/m3_60_production_promotion_verifier.py
          tests/test_production_promotion_verifier_m3_60.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_production_promotion_verifier_m3_60.py
          tests/test_production_promotion_gate_m3_59.py
          tests/test_deployment_evidence_bundle_m3_58.py
          tests/test_deployment_evidence_verifier_m3_57.py
      - name: Confirm no promotion/deployment mutation
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|'
          pattern+='helm (install|upgrade|rollback)|terraform (apply|destroy)|'
          pattern+='gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden production mutation command found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.60 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion is not executed by this workflow." >> "$GITHUB_STEP_SUMMARY"
