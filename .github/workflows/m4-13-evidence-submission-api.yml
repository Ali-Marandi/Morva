name: M4.13 Evidence Submission API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-13-evidence-submission-api.yml"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_submission.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "tests/test_evidence_submission_service_m4_13.py"
      - "tests/test_evidence_submission_policy_m4_13.py"
      - "docs/M4_13_EVIDENCE_SUBMISSION_API.md"
      - "alembic/versions/0022_authoritative_evidence_submissions.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-13-evidence-submission-api.yml"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_submission.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "tests/test_evidence_submission_service_m4_13.py"
      - "tests/test_evidence_submission_policy_m4_13.py"
      - "docs/M4_13_EVIDENCE_SUBMISSION_API.md"
      - "alembic/versions/0022_authoritative_evidence_submissions.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/evidence_submission.py
          src/morva/api/v1/evidence_submissions.py
          src/morva/persistence/evidence_submission_records.py
          src/morva/security/policy.py
          src/morva/persistence/database.py
          tests/test_evidence_submission_service_m4_13.py
          tests/test_evidence_submission_policy_m4_13.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_submission_service_m4_13.py
          tests/test_evidence_submission_policy_m4_13.py
      - name: Migration
        run: alembic upgrade head
