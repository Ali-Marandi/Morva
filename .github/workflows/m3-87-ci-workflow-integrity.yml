name: M3.87 CI Workflow Integrity Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/morva/runtime/ci_workflow_integrity.py"
      - "tools/m3_87_ci_workflow_integrity.py"
      - "tests/test_ci_workflow_integrity_m3_87.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/morva/runtime/ci_workflow_integrity.py"
      - "tools/m3_87_ci_workflow_integrity.py"
      - "tests/test_ci_workflow_integrity_m3_87.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/ci_workflow_integrity.py
          tools/m3_87_ci_workflow_integrity.py
          tests/test_ci_workflow_integrity_m3_87.py
      - run: pytest -q tests/test_ci_workflow_integrity_m3_87.py
      - run: python tools/m3_87_ci_workflow_integrity.py --root .
