name: M4.67 Independent M4.66 Receipt Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-67-independent-m4-66-receipt-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "src/morva/runtime/independent_historical_m4_66_receipt_verifier_m4_67.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-67-independent-m4-66-receipt-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "src/morva/runtime/independent_historical_m4_66_receipt_verifier_m4_67.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.67-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-m4-66-receipt-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py
          src/morva/runtime/independent_historical_m4_66_receipt_verifier_m4_67.py
          tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py
          tests/test_independent_historical_m4_64_verification_receipts_m4_66.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py
          tests/test_independent_historical_m4_64_verification_receipts_m4_66.py
      - name: Boundary
        run: |
          echo "M4.67 independently verifies each persisted M4.66 receipt against a fresh M4.65 reconstruction." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
