name: Morva Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to validate and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

auto-release:

jobs:
  prepare-tag:
    name: Prepare version tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        run: |
          version=$(python -c 'import re; from pathlib import Path; text=Path("pyproject.toml").read_text(); print(re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.M).group(1))')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create missing version tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Morva $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  validate:
    name: Validate release
    needs: prepare-tag
    if: >-
      always() &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.prepare-tag.result == 'success')
      ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-tag.result == 'success')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: morva
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            tag="${{ needs.prepare-tag.outputs.tag }}"
            ref="${{ github.sha }}"
          else
            tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
            ref="$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build pip-audit

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          expected="v$(python -c 'from morva import __version__; print(__version__)')"
          test "$expected" = "$RELEASE_TAG" || {
            echo "Version mismatch: repository=$expected release=$RELEASE_TAG"
            exit 1
          }

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check .

      - name: Migrate test database
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
        run: alembic upgrade head

      - name: Test
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
        run: pytest -q

      - name: Dependency audit
        run: pip-audit

      - name: Build Python distribution
        run: python -m build

      - name: Build web distribution
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morva-${{ steps.ref.outputs.tag }}
          path: |
            dist/*
            web/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            version=$(python -c 'import re; from pathlib import Path; text=Path("pyproject.toml").read_text(); print(re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.M).group(1))')
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: morva-${{ steps.tag.outputs.tag }}
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Morva ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/dist/* --clobber
