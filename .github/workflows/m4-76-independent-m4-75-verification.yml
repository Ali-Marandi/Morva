name: M4.76-M4.77 Independent Verification Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-76-independent-m4-75-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_independent_historical_m4_75_verification_receipts_m4_77.py"
      - "alembic/versions/0055_independent_m4_75_verification_receipts_m4_77.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py"
      - "src/morva/api/v1/m4_77_verification_receipts.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-76-independent-m4-75-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.76-M4.77-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py
          src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py
          src/morva/api/v1/m4_77_verification_receipts.py
          src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py
          tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py
          tests/test_independent_historical_m4_75_verification_receipts_m4_77.py
      - name: Pytest
        env:
          MORVA_ENV: test
        run: >
          pytest -q
          tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py
          tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py
          tests/test_independent_historical_m4_75_verification_receipts_m4_77.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_77.db
          MORVA_ENV: test
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.76 independently verifies M4.75 point-in-time M4.74 receipt-history integrity snapshots and M4.77 persists those verification results." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
