name: M3.56 Deployment Evidence Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-evidence:
    name: Verify deployment evidence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/release_deployment_evidence.py
          src/morva/runtime/release_post_publication.py
          tools/m3_56_deployment_evidence_gate.py
          tests/test_release_deployment_evidence_m3_56.py
          tests/test_release_post_publication_verifier_m3_55.py
          tests/test_release_publication_gate_m3_53.py
          tests/test_release_trust_artifact_m3_52.py
          tests/test_release_trust_pack_m3_51.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_release_deployment_evidence_m3_56.py
          tests/test_release_post_publication_verifier_m3_55.py
          tests/test_release_publication_gate_m3_53.py
          tests/test_release_trust_artifact_m3_52.py
          tests/test_release_trust_pack_m3_51.py
          tests/test_trust_chain_m3_50.py
      - name: Confirm no deployment or release mutations
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|helm (install|upgrade|rollback)|terraform (apply|destroy)|gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden deployment/release mutation command found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.56 is an evidence gate, not a deployment executor." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment, Release, tag or asset mutation is performed." >> "$GITHUB_STEP_SUMMARY"
