name: M3.35 target-scale property mutation gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  m3-35:
    name: Scale, concurrency, property and mutation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          ruff check
          tests/test_m3_35_financial_properties.py
          tests/test_m3_35_concurrency.py
          tests/performance/test_m3_35_target_scale.py
          tools/m3_35_mutation_gate.py
      - run: >-
          pytest -q
          tests/test_m3_35_financial_properties.py
          tests/test_m3_35_concurrency.py
          tests/performance/test_m3_35_target_scale.py
      - run: python tools/m3_35_mutation_gate.py
