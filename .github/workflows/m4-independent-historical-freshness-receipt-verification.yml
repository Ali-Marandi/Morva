name: M4.45 Independent Historical Freshness Receipt Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-historical-freshness-receipt-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py"
      - "src/morva/runtime/historical_freshness_chain_verifier_m4_43.py"
      - "src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py"
      - "tests/test_independent_historical_freshness_chain_verification_receipt_m4_45.py"
      - "tests/test_historical_freshness_chain_verification_receipts_m4_44.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-historical-freshness-receipt-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py"
      - "src/morva/runtime/historical_freshness_chain_verifier_m4_43.py"
      - "src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py"
      - "tests/test_independent_historical_freshness_chain_verification_receipt_m4_45.py"
      - "tests/test_historical_freshness_chain_verification_receipts_m4_44.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_freshness_chain_verification_receipt_verifier_m4_45.py
          src/morva/runtime/historical_freshness_chain_verifier_m4_43.py
          src/morva/persistence/historical_freshness_chain_verification_receipts_m4_44.py
          tests/test_independent_historical_freshness_chain_verification_receipt_m4_45.py
          tests/test_historical_freshness_chain_verification_receipts_m4_44.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_freshness_chain_verification_receipt_m4_45.py
          tests/test_historical_freshness_chain_verification_receipts_m4_44.py
      - name: Boundary
        run: |
          echo "M4.45 independently verifies persisted M4.44 receipt identity against a separately reconstructed M4.36→M4.37→M4.40→M4.41 chain." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
