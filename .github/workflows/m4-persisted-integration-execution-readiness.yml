name: M4 Persisted Integration Execution Readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-persisted-integration-execution-readiness.yml"
      - "alembic/env.py"
      - "alembic/versions/0025_integration_execution_readiness_verifications.py"
      - "alembic/versions/0026_integration_readiness_scope_bindings.py"
      - "alembic/versions/0027_scope_bound_readiness_convergences.py"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/integration_execution_readiness_records.py"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier_m4_21.py"
      - "src/morva/runtime/persist_integration_execution_readiness_m4_24.py"
      - "src/morva/runtime/readiness_scope_binding_m4_25.py"
      - "src/morva/runtime/scope_bound_readiness_convergence_m4_26.py"
      - "src/morva/persistence/scoped_evidence_readiness_m4_26.py"
      - "src/morva/persistence/scope_bound_readiness_convergence_records_m4_27.py"
      - "src/morva/runtime/persist_scope_bound_readiness_convergence_m4_27.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/evidence_readiness.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_integration_execution_readiness_persistence_m4_22.py"
      - "tests/test_integration_execution_readiness_api_m4_22.py"
      - "tests/test_integration_execution_readiness_history_m4_23.py"
      - "tests/test_persist_integration_execution_readiness_m4_24.py"
      - "tests/test_integration_execution_readiness_scope_m4_25.py"
      - "tests/test_scope_bound_readiness_convergence_m4_26.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-persisted-integration-execution-readiness.yml"
      - "alembic/env.py"
      - "alembic/versions/0025_integration_execution_readiness_verifications.py"
      - "alembic/versions/0026_integration_readiness_scope_bindings.py"
      - "alembic/versions/0027_scope_bound_readiness_convergences.py"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/integration_execution_readiness_records.py"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier_m4_21.py"
      - "src/morva/runtime/persist_integration_execution_readiness_m4_24.py"
      - "src/morva/runtime/readiness_scope_binding_m4_25.py"
      - "src/morva/runtime/scope_bound_readiness_convergence_m4_26.py"
      - "src/morva/persistence/scoped_evidence_readiness_m4_26.py"
      - "src/morva/persistence/scope_bound_readiness_convergence_records_m4_27.py"
      - "src/morva/runtime/persist_scope_bound_readiness_convergence_m4_27.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/evidence_readiness.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_integration_execution_readiness_persistence_m4_22.py"
      - "tests/test_integration_execution_readiness_api_m4_22.py"
      - "tests/test_integration_execution_readiness_history_m4_23.py"
      - "tests/test_persist_integration_execution_readiness_m4_24.py"
      - "tests/test_integration_execution_readiness_scope_m4_25.py"
      - "tests/test_scope_bound_readiness_convergence_m4_26.py"
      - "tests/test_scoped_evidence_readiness_m4_26.py"
      - "tests/test_scope_bound_readiness_convergence_m4_26.py"
      - "tests/test_scoped_evidence_readiness_m4_26.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/integration_execution_readiness_records.py
          src/morva/runtime/persist_integration_execution_readiness_m4_24.py
          src/morva/runtime/readiness_scope_binding_m4_25.py
          src/morva/runtime/scope_bound_readiness_convergence_m4_26.py
          src/morva/persistence/scoped_evidence_readiness_m4_26.py
          tests/test_integration_execution_readiness_persistence_m4_22.py
          tests/test_integration_execution_readiness_api_m4_22.py
          tests/test_integration_execution_readiness_history_m4_23.py
          tests/test_persist_integration_execution_readiness_m4_24.py
          tests/test_integration_execution_readiness_scope_m4_25.py
          tests/test_scope_bound_readiness_convergence_m4_26.py
          tests/test_scoped_evidence_readiness_m4_26.py
          tests/test_scope_bound_readiness_convergence_persistence_m4_27.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_integration_execution_readiness_persistence_m4_22.py
          tests/test_integration_execution_readiness_api_m4_22.py
          tests/test_integration_execution_readiness_history_m4_23.py
          tests/test_persist_integration_execution_readiness_m4_24.py
          tests/test_integration_execution_readiness_scope_m4_25.py
          tests/test_scope_bound_readiness_convergence_m4_26.py
          tests/test_scoped_evidence_readiness_m4_26.py
          tests/test_scope_bound_readiness_convergence_persistence_m4_27.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_22.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.26 rebuilds current evidence readiness for the exact receipt scope and compares it with the persisted M4.21 evidence fingerprint." >> "$GITHUB_STEP_SUMMARY"
          echo "The readiness API is read-only and performs no provider activation, credential use or production mutation." >> "$GITHUB_STEP_SUMMARY"
