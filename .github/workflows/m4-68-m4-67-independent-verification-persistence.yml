name: M4.68 M4.67 Independent Verification Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-68-m4-67-independent-verification-persistence.yml"
      - "alembic/versions/0049_independent_m4_66_receipt_verification_persistence_m4_68.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/runtime/independent_historical_m4_66_receipt_verifier_m4_67.py"
      - "src/morva/runtime/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-68-m4-67-independent-verification-persistence.yml"
      - "alembic/versions/0049_independent_m4_66_receipt_verification_persistence_m4_68.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/runtime/independent_historical_m4_66_receipt_verifier_m4_67.py"
      - "src/morva/runtime/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.68-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-67-independent-verification-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py
          src/morva/runtime/independent_historical_m4_67_verification_persistence_m4_68.py
          tests/test_independent_historical_m4_67_verification_persistence_m4_68.py
          tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_67_verification_persistence_m4_68.py
          tests/test_independent_historical_m4_66_receipt_verifier_m4_67.py
          tests/test_independent_historical_m4_64_verification_receipts_m4_66.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_68.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.68 persists independent M4.67 receipt-level verification results with fingerprint idempotency and source-chain re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
