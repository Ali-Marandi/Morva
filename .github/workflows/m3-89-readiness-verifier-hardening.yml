name: M3.89 Readiness Verifier Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3-89-readiness-verifier-hardening.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m3_88.py"
      - "docs/M3_89_READINESS_VERIFIER_HARDENING.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-89-readiness-verifier-hardening.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m3_88.py"
      - "docs/M3_89_READINESS_VERIFIER_HARDENING.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_integration_execution_readiness_verifier.py
          tests/test_independent_integration_execution_readiness_verifier_m3_88.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_integration_execution_readiness_verifier_m3_88.py
          tests/test_integration_execution_readiness_gate_m3_86.py
          tests/test_independent_integration_execution_verifier_m3_85.py
      - name: Boundary
        run: |
          echo "M3.89 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "No adapter endpoint, credential or production deployment is activated." >> "$GITHUB_STEP_SUMMARY"
