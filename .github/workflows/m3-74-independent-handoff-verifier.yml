name: M3.74 Independent Production Readiness Handoff Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Independently verify readiness handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_handoff_verifier.py
          src/morva/runtime/production_readiness_handoff.py
          src/morva/runtime/production_readiness_convergence.py
          tools/m3_74_independent_handoff_verifier.py
          tests/test_independent_handoff_verifier_m3_74.py
      - name: Pytest
        run: >
          pytest -q tests/test_independent_handoff_verifier_m3_74.py
      - name: Record production boundary
        run: |
          echo "M3.74 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "No production certification, publication, promotion or deployment is performed." >> "$GITHUB_STEP_SUMMARY"
