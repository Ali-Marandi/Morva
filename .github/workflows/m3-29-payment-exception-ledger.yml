name: M3.29 Payment Exception Ledger Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  m3-29-payment-exception-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/payroll/payment_exception_ledger.py tests/test_payment_exception_ledger_m3_29.py
      - run: pytest -q tests/test_payment_exception_ledger_m3_29.py
