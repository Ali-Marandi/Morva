name: M4.66 M4.65 Verification Receipt Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-66-m4-65-verification-receipt-persistence.yml"
      - "alembic/versions/0048_independent_m4_64_verification_receipts_m4_66.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-66-m4-65-verification-receipt-persistence.yml"
      - "alembic/versions/0048_independent_m4_64_verification_receipts_m4_66.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_independent_historical_m4_64_verification_receipts_m4_66.py"
      - "tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.66-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-65-verification-receipt-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_64_verification_receipts_m4_66.py
          src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py
          tests/test_independent_historical_m4_64_verification_receipts_m4_66.py
          tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_64_verification_receipts_m4_66.py
          tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py
          tests/test_historical_m4_63_receipt_history_integrity_m4_64.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_66.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.66 persists M4.65 independent receipt-history verification results with append-only, fingerprint-idempotent storage and source re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
