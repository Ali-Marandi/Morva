name: M4.17 Evidence Role Bindings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-17-evidence-role-bindings.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/runtime/evidence_convergence.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_evidence_role_binding_m4_17.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "tests/test_evidence_lifecycle_persistence_m4_16.py"
      - "alembic/versions/0024_evidence_role_bindings.py"
      - "docs/M4_17_EVIDENCE_ROLE_BINDINGS.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-17-evidence-role-bindings.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/runtime/evidence_convergence.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_evidence_role_binding_m4_17.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "tests/test_evidence_lifecycle_persistence_m4_16.py"
      - "alembic/versions/0024_evidence_role_bindings.py"
      - "docs/M4_17_EVIDENCE_ROLE_BINDINGS.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/evidence_submissions.py
          src/morva/security/policy.py
          src/morva/persistence/database.py
          src/morva/persistence/evidence_role_binding_records.py
          src/morva/runtime/evidence_convergence.py
          src/morva/runtime/evidence_registry_bridge.py
          tests/test_evidence_role_binding_m4_17.py
          tests/test_evidence_lifecycle_m4_15.py
          tests/test_evidence_lifecycle_persistence_m4_16.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_role_binding_m4_17.py
          tests/test_evidence_lifecycle_m4_15.py
          tests/test_evidence_lifecycle_persistence_m4_16.py
      - name: Migration
        run: alembic upgrade head
