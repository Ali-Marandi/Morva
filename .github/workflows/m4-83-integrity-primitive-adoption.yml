name: M4.83 Integrity Primitive Adoption

on:
  pull_request:
    branches:
      - main
      - feat/m4-73-m4-72-independent-verification
    paths:
      - ".github/workflows/m4-83-integrity-primitive-adoption.yml"
      - "src/morva/runtime/historical_integrity_primitives.py"
      - "src/morva/runtime/independent_m4_77_verification_receipt_m4_80.py"
      - "tests/test_historical_integrity_primitives.py"
      - "tests/test_independent_m4_77_verification_receipt_m4_80.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.83-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/historical_integrity_primitives.py
          src/morva/runtime/independent_m4_77_verification_receipt_m4_80.py
          tests/test_historical_integrity_primitives.py
          tests/test_independent_m4_77_verification_receipt_m4_80.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_integrity_primitives.py
          tests/test_independent_m4_77_verification_receipt_m4_80.py
      - name: Boundary
        run: |
          echo "M4.83 binds M4.80 verification fingerprints to the shared canonical SHA-256 primitive without changing the fingerprint payload." >> "\${GITHUB_STEP_SUMMARY}"
          echo "Semantics-preserving integrity refactor; no production authority or provider execution." >> "\${GITHUB_STEP_SUMMARY}"
