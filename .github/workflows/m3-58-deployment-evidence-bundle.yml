name: M3.58 Deployment Evidence Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-evidence-bundle:
    name: Verify deterministic evidence bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/deployment_evidence_bundle.py
          src/morva/runtime/deployment_evidence_verifier.py
          src/morva/runtime/release_deployment_evidence.py
          src/morva/runtime/release_post_publication.py
          tools/m3_58_deployment_evidence_bundle.py
          tests/test_deployment_evidence_bundle_m3_58.py
          tests/test_deployment_evidence_verifier_m3_57.py
          tests/test_release_deployment_evidence_m3_56.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_deployment_evidence_bundle_m3_58.py
          tests/test_deployment_evidence_verifier_m3_57.py
          tests/test_release_deployment_evidence_m3_56.py
          tests/test_release_post_publication_verifier_m3_55.py
      - name: Confirm CI is non-mutating
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|helm (install|upgrade|rollback)|terraform (apply|destroy)|gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden deployment or release mutation found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.58 creates an evidence bundle, not a deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Private-key material is rejected." >> "$GITHUB_STEP_SUMMARY"
          echo "Production certification remains external." >> "$GITHUB_STEP_SUMMARY"
