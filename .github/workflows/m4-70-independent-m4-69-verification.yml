name: M4.70 Independent M4.69 Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-70-independent-m4-69-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/runtime/independent_historical_m4_68_verification_history_integrity_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
      - "tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-70-independent-m4-69-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "src/morva/runtime/independent_historical_m4_68_verification_history_integrity_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
      - "tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_68_verification_history_integrity_m4_70.py
          tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_68_verification_history_integrity_m4_69.py
          tests/test_independent_historical_m4_68_verification_history_integrity_m4_70.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_70.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.70 independently reconstructs and verifies M4.69 verification-history integrity snapshots." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
