name: M4.16 Evidence Lifecycle API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-16-evidence-lifecycle-api.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "tests/test_evidence_lifecycle_persistence_m4_16.py"
      - "tests/test_evidence_lifecycle_api_m4_16.py"
      - "tests/test_evidence_lifecycle_policy_m4_16.py"
      - "alembic/versions/0023_evidence_lifecycle.py"
      - "docs/M4_16_EVIDENCE_LIFECYCLE_API.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-16-evidence-lifecycle-api.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/security/policy.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "tests/test_evidence_lifecycle_m4_15.py"
      - "tests/test_evidence_lifecycle_persistence_m4_16.py"
      - "tests/test_evidence_lifecycle_api_m4_16.py"
      - "tests/test_evidence_lifecycle_policy_m4_16.py"
      - "alembic/versions/0023_evidence_lifecycle.py"
      - "docs/M4_16_EVIDENCE_LIFECYCLE_API.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/evidence_submissions.py
          src/morva/security/policy.py
          src/morva/persistence/database.py
          src/morva/persistence/evidence_lifecycle_records.py
          src/morva/runtime/evidence_lifecycle.py
          src/morva/runtime/evidence_registry_bridge.py
          tests/test_evidence_lifecycle_m4_15.py
          tests/test_evidence_lifecycle_persistence_m4_16.py
          tests/test_evidence_lifecycle_api_m4_16.py
          tests/test_evidence_lifecycle_policy_m4_16.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_lifecycle_m4_15.py
          tests/test_evidence_lifecycle_persistence_m4_16.py
          tests/test_evidence_lifecycle_api_m4_16.py
          tests/test_evidence_lifecycle_policy_m4_16.py
      - name: Migration
        run: alembic upgrade head
