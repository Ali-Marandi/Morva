name: M3.75 Official Adapter Evidence Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapter-evidence:
    name: Verify official adapter readiness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/official_adapter_evidence.py
          tests/test_official_adapter_evidence_m3_75.py
      - name: Pytest
        run: >
          pytest -q tests/test_official_adapter_evidence_m3_75.py
      - name: Record production boundary
        run: |
          echo "M3.75 records official adapter contract evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "Real SINA/accounting/treasury/bank/tax/insurance endpoints remain disabled until authoritative contracts and evidence exist." >> "$GITHUB_STEP_SUMMARY"
