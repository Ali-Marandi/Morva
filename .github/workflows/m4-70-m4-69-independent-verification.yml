name: M4.70 M4.69 Independent Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-70-m4-69-independent-verification.yml"
      - "src/morva/runtime/independent_historical_m4_69_verification_m4_70.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_69_verification_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-70-m4-69-independent-verification.yml"
      - "src/morva/runtime/independent_historical_m4_69_verification_m4_70.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_68_verification_history_integrity_m4_69.py"
      - "src/morva/persistence/independent_historical_m4_67_verification_persistence_m4_68.py"
      - "tests/test_independent_historical_m4_69_verification_m4_70.py"
      - "tests/test_historical_m4_68_verification_history_integrity_m4_69.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-69-independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_69_verification_m4_70.py
          tests/test_independent_historical_m4_69_verification_m4_70.py
          tests/test_historical_m4_68_verification_history_integrity_m4_69.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_69_verification_m4_70.py
          tests/test_historical_m4_68_verification_history_integrity_m4_69.py
      - name: Boundary
        run: |
          echo "M4.70 independently reconstructs M4.69 snapshots from point-in-time M4.68 history." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
