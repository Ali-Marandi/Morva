name: M4.9 Disaster-Recovery Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-9-dr-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/disaster_recovery.py"
      - "src/morva/runtime/dr_evidence_bridge.py"
      - "tests/test_dr_evidence_bridge_m4_9.py"
      - "docs/M4_9_DR_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-9-dr-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/disaster_recovery.py"
      - "src/morva/runtime/dr_evidence_bridge.py"
      - "tests/test_dr_evidence_bridge_m4_9.py"
      - "docs/M4_9_DR_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/dr_evidence_bridge.py
          tests/test_dr_evidence_bridge_m4_9.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_dr_evidence_bridge_m4_9.py
      - name: Boundary
        run: |
          echo "M4.9 binds DR drill evidence identities only." >> "$GITHUB_STEP_SUMMARY"
          echo "No restore drill or production infrastructure mutation is performed." >> "$GITHUB_STEP_SUMMARY"
