name: M3.25 Ledger Treatment Activation Gate

on:
  pull_request:
    paths:
      - "src/morva/ledger/population_treatment.py"
      - "src/morva/ledger/treatments.py"
      - "tests/test_population_scoped_ledger_treatment.py"
      - ".github/workflows/m3-25-ledger-treatment.yml"

jobs:
  ledger-treatment-activation:
    name: M3.25 population-scoped ledger treatment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/ledger/population_treatment.py src/morva/ledger/treatments.py tests/test_population_scoped_ledger_treatment.py
      - run: pytest -q tests/test_population_scoped_ledger_treatment.py tests/test_ledger_treatment_governance.py
