name: Morva Main Release Validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to validate"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: morva
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build pip-audit

      - name: Verify source version
        run: |
          expected="v$(python -c 'from morva import __version__; print(__version__)')"
          test "$expected" = "${{ inputs.tag }}"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check .

      - name: Migrate test database
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
        run: alembic upgrade head

      - name: Test
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
        run: pytest -q

      - name: Dependency audit
        run: pip-audit

      - name: Build Python distribution
        run: python -m build

      - name: Build web distribution
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Record publication boundary
        run: |
          echo "Release validation completed for ${{ inputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Publication is not performed here; use M3.54 with external authorization." >> "$GITHUB_STEP_SUMMARY"
