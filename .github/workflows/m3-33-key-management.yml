name: M3.33 Managed Key Hardening Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  m3-33-key-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/runtime/key_management.py src/morva/runtime/config.py tests/test_key_management_m3_33.py
      - run: pytest -q tests/test_key_management_m3_33.py tests/test_runtime_config.py
