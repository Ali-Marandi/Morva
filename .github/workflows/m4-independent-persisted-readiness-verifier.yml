name: M4 Independent Persisted Integration Readiness Verification

on:
  push:
    branches: [main]
    paths:
      - "src/morva/runtime/independent_persisted_integration_readiness_verifier_m4_23.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/integration_execution_readiness_records.py"
      - "tests/test_independent_persisted_integration_readiness_verifier_m4_23.py"
      - "tests/test_integration_execution_readiness_api_m4_23.py"
      - "alembic/versions/0025_integration_execution_readiness_verifications.py"
      - ".github/workflows/m4-independent-persisted-readiness-verifier.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/morva/runtime/independent_persisted_integration_readiness_verifier_m4_23.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/integration_execution_readiness_records.py"
      - "tests/test_independent_persisted_integration_readiness_verifier_m4_23.py"
      - "tests/test_integration_execution_readiness_api_m4_23.py"
      - "alembic/versions/0025_integration_execution_readiness_verifications.py"
      - ".github/workflows/m4-independent-persisted-readiness-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
          POSTGRES_DB: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >-
          ruff check
          src/morva/runtime/independent_persisted_integration_readiness_verifier_m4_23.py
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/integration_execution_readiness_records.py
          tests/test_independent_persisted_integration_readiness_verifier_m4_23.py
          tests/test_integration_execution_readiness_api_m4_23.py
      - name: Pytest
        run: >-
          pytest -q
          tests/test_independent_persisted_integration_readiness_verifier_m4_23.py
          tests/test_integration_execution_readiness_api_m4_23.py
          tests/test_integration_execution_readiness_api_m4_22.py
      - name: Migration
        env:
          DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
        run: alembic upgrade head
      - name: Boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "src/morva/api/v1/integration_execution_readiness.py"
          ).read_text(encoding="utf-8")
          assert "/readiness/verify" in text
          assert "latest_raw" in text
          assert "SessionLocal" in text
          assert "POST" not in text
          print(
              "M4.23 boundary verified: read-only independent verification; "
              "no provider activation, credentials, payment authorization, "
              "or production mutation."
          )
          PY
