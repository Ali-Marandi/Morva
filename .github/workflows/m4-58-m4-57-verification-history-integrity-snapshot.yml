name: M4.58 M4.57 Verification Receipt-History Integrity Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-58-m4-57-verification-history-integrity-snapshot.yml"
      - "alembic/versions/0043_historical_m4_57_verification_receipt_history_integrity.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
      - "src/morva/persistence/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/runtime/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "tests/test_historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "tests/test_independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-58-m4-57-verification-history-integrity-snapshot.yml"
      - "alembic/versions/0043_historical_m4_57_verification_receipt_history_integrity.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
      - "src/morva/persistence/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/runtime/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "tests/test_historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "tests/test_independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.58-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-57-receipt-history-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/historical_m4_57_verification_receipt_history_integrity_m4_58.py
          src/morva/runtime/historical_m4_57_verification_receipt_history_integrity_m4_58.py
          tests/test_historical_m4_57_verification_receipt_history_integrity_m4_58.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_57_verification_receipt_history_integrity_m4_58.py
          tests/test_independent_historical_m4_56_receipt_verification_persistence_m4_57.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_58.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.58 snapshots point-in-time M4.57 independent verification receipt history with deterministic integrity fingerprints and source re-verification." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
