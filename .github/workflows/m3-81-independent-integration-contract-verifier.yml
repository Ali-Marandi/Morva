name: M3.81 Independent Integration Contract Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Verify adapter ports against contract manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >
          ruff check
          src/morva/integrations/ports.py
          src/morva/runtime/integration_contract_manifest.py
          src/morva/runtime/independent_integration_contract_verifier.py
          tests/test_independent_integration_contract_verifier_m3_81.py
      - run: pytest -q tests/test_independent_integration_contract_verifier_m3_81.py
      - name: Record production boundary
        run: |
          echo "M3.81 verifies internal adapter interfaces only." >> "$GITHUB_STEP_SUMMARY"
