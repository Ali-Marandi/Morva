name: M4.75 M4.74 Receipt-History Snapshot CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-75-m4-74-receipt-history-snapshot-ci.yml"
      - "alembic/versions/0053_independent_m4_72_verification_receipts_m4_74.py"
      - "alembic/versions/0054_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-75-m4-74-receipt-history-snapshot-ci.yml"
      - "alembic/versions/0053_independent_m4_72_verification_receipts_m4_74.py"
      - "alembic/versions/0054_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-75-m4-74-history-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >-
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py
          src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py
          src/morva/runtime/historical_m4_74_verification_receipt_history_integrity_m4_75.py
          tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py
      - name: Targeted pytest
        run: >-
          pytest -q
          tests/test_historical_m4_71_verification_history_integrity_m4_72.py
          tests/test_independent_historical_m4_72_verification_receipts_m4_74.py
          tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_75.db
          MORVA_ENV: test
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.75 captures append-only, fingerprint-idempotent point-in-time integrity snapshots over the complete M4.74 verification-receipt history." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification/readiness-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
