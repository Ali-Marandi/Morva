name: M3.76 Independent Official Adapter Evidence Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Independently verify adapter evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/official_adapter_evidence.py
          src/morva/runtime/independent_adapter_evidence_verifier.py
          tests/test_independent_adapter_evidence_verifier_m3_76.py
          tools/m3_76_independent_adapter_evidence_verifier.py
      - name: Pytest
        run: >
          pytest -q tests/test_independent_adapter_evidence_verifier_m3_76.py
      - name: Record production boundary
        run: |
          echo "M3.76 is verification-only; no real adapter endpoint is activated." >> "$GITHUB_STEP_SUMMARY"
