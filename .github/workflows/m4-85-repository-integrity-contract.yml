name: M4.85 Repository Integrity Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m4-85-repository-integrity-contract.yml"
      - "contracts/historical_integrity_manifest_m4_86.json"
      - "src/morva/runtime/historical_integrity_primitives.py"
      - "src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
      - "src/morva/runtime/independent_m4_77_verification_receipt_m4_80.py"
      - "src/morva/persistence/independent_m4_77_verification_receipts_m4_79.py"
      - "src/morva/persistence/independent_m4_79_verification_receipts_m4_81.py"
      - "tests/test_historical_integrity_contract_m4_85.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.85-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          tests/test_historical_integrity_contract_m4_85.py
      - name: Contract
        run: >
          pytest -q
          tests/test_historical_integrity_primitives.py
          tests/test_historical_integrity_primitive_adoption_guard_m4_84.py
          tests/test_historical_integrity_contract_m4_85.py
      - name: Boundary
        run: |
          echo "M4.85 enforces the repository-wide dependency contract across the M4.77-M4.81 integrity chain." >> "$GITHUB_STEP_SUMMARY"
          echo "No persistence schema, API contract, fingerprint semantics or production authority changes." >> "$GITHUB_STEP_SUMMARY"
