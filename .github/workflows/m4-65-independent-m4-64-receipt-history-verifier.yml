name: M4.65 Independent M4.64 Receipt-History Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-65-independent-m4-64-receipt-history-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_historical_m4_63_receipt_history_integrity_m4_64.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-65-independent-m4-64-receipt-history-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_63_receipt_history_integrity_m4_64.py"
      - "src/morva/persistence/independent_historical_m4_61_receipt_history_verification_m4_63.py"
      - "src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py"
      - "tests/test_historical_m4_63_receipt_history_integrity_m4_64.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.65-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-m4-64-receipt-history-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_64_receipt_history_verifier_m4_65.py
          tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_64_receipt_history_verifier_m4_65.py
          tests/test_historical_m4_63_receipt_history_integrity_m4_64.py
      - name: Boundary
        run: |
          echo "M4.65 independently reconstructs the point-in-time M4.63 receipt history behind each M4.64 snapshot." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
