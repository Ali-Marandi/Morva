# M4.46 persistence tranche: keep the main test suite as the cumulative validation trigger.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "pyproject.toml"
      - "alembic/**"
      - "src/**"
      - "tests/**"
      - "fixtures/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: morva
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
      - run: pytest -q
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
