name: M4 Independent Integration Execution Readiness Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-integration-execution-readiness-verifier.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier_m4_21.py"
      - "src/morva/runtime/integration_execution_readiness_assessment.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m4_21.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-independent-integration-execution-readiness-verifier.yml"
      - "src/morva/runtime/independent_integration_execution_readiness_verifier_m4_21.py"
      - "src/morva/runtime/integration_execution_readiness_assessment.py"
      - "tests/test_independent_integration_execution_readiness_verifier_m4_21.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_integration_execution_readiness_verifier_m4_21.py
          tests/test_independent_integration_execution_readiness_verifier_m4_21.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_integration_execution_readiness_verifier_m4_21.py
      - name: Boundary
        run: |
          echo "M4.21 independently verifies the M4.20 readiness assessment without calling the M4.20 builder." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification is read-only and introduces no provider activation, credential use or production mutation." >> "$GITHUB_STEP_SUMMARY"
