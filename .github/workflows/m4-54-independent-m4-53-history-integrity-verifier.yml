name: M4.54 Independent M4.53 History Integrity Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-54-independent-m4-53-history-integrity-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "src/morva/runtime/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/runtime/independent_historical_m4_52_verification_receipt_history_integrity_verifier_m4_54.py"
      - "tests/test_independent_historical_m4_52_verification_receipt_history_integrity_m4_54.py"
      - "tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-54-independent-m4-53-history-integrity-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "src/morva/runtime/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/runtime/independent_historical_m4_52_verification_receipt_history_integrity_verifier_m4_54.py"
      - "tests/test_independent_historical_m4_52_verification_receipt_history_integrity_m4_54.py"
      - "tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.54-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-m4-53-history-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/historical_m4_52_verification_receipt_history_integrity_m4_53.py
          src/morva/runtime/independent_historical_m4_52_verification_receipt_history_integrity_verifier_m4_54.py
          tests/test_independent_historical_m4_52_verification_receipt_history_integrity_m4_54.py
          tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_52_verification_receipt_history_integrity_m4_54.py
          tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py
          tests/test_independent_historical_verification_receipt_history_integrity_m4_52.py
      - name: Boundary
        run: |
          echo "M4.54 independently reconstructs the point-in-time M4.52 receipt history behind each M4.53 snapshot and emits deterministic blocker codes and a verification fingerprint." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
