name: M3.27 Three-Way Reconciliation Gate

on:
  pull_request:
    paths:
      - "src/morva/payroll/three_way_reconciliation.py"
      - "tests/test_three_way_reconciliation.py"
      - "docs/M3_27_THREE_WAY_RECONCILIATION.md"
      - ".github/workflows/m3-27-three-way-reconciliation.yml"

jobs:
  reconciliation:
    name: M3.27 three-way reconciliation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/payroll/three_way_reconciliation.py tests/test_three_way_reconciliation.py
      - run: pytest -q tests/test_three_way_reconciliation.py
