name: M3.90 Dynamic Workflow Execution Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/morva/runtime/ci_workflow_integrity.py"
      - "src/morva/runtime/production_boundary_policy.py"
      - "tests/test_ci_workflow_integrity_m3_87.py"
      - "tests/test_production_boundary_policy_m3_61.py"
      - "docs/M3_90_DYNAMIC_WORKFLOW_EXECUTION_HARDENING.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/morva/runtime/ci_workflow_integrity.py"
      - "src/morva/runtime/production_boundary_policy.py"
      - "tests/test_ci_workflow_integrity_m3_87.py"
      - "tests/test_production_boundary_policy_m3_61.py"
      - "docs/M3_90_DYNAMIC_WORKFLOW_EXECUTION_HARDENING.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/ci_workflow_integrity.py
          src/morva/runtime/production_boundary_policy.py
          tests/test_ci_workflow_integrity_m3_87.py
          tests/test_production_boundary_policy_m3_61.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_ci_workflow_integrity_m3_87.py
          tests/test_production_boundary_policy_m3_61.py
      - name: Boundary
        run: |
          echo "M3.90 is static verification-only hardening." >> "$GITHUB_STEP_SUMMARY"
