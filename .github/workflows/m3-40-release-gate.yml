name: M3.40 Aggregate Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: Aggregate release evidence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/runtime/release_gate.py tests/test_release_gate_m3_40.py tools/m3_40_release_gate.py
      - run: pytest -q tests/test_release_gate_m3_40.py
      - name: Verify tooling imports
        run: python -c "import tools.m3_38_release_candidate_check, tools.m3_40_release_gate"
