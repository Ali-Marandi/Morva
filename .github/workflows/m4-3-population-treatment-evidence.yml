name: M4.3 Population Treatment Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-3-population-treatment-evidence.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/rules/population_treatment_evidence.py"
      - "tests/test_population_treatment_evidence_m4_3.py"
      - "docs/M4_3_POPULATION_TREATMENT_EVIDENCE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-3-population-treatment-evidence.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/rules/population_treatment_evidence.py"
      - "tests/test_population_treatment_evidence_m4_3.py"
      - "docs/M4_3_POPULATION_TREATMENT_EVIDENCE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  treatment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/authoritative_evidence_intake.py
          src/morva/rules/population_treatment_evidence.py
          tests/test_population_treatment_evidence_m4_3.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_population_treatment_evidence_m4_3.py
      - name: Boundary
        run: |
          echo "M4.3 records population-scoped legal treatment evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No statutory rate, threshold, exemption amount or production activation is introduced." >> "$GITHUB_STEP_SUMMARY"
