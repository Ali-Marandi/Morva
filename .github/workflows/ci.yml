name: CI

on:
  push:
    branches: [main, "m3.9-authoritative-master-data-gate"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: morva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d morva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  m3-6-gate:
    name: M3.6 teacher rank provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank.py src/morva/hr/teacher_rank_decision_provenance.py tests/test_teacher_rank_decision_provenance.py
      - run: pytest -q tests/test_teacher_rank_decision_provenance.py

  m3-7-gate:
    name: M3.7 teacher rank provenance verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank_provenance_verifier.py tests/test_teacher_rank_provenance_verifier.py
      - run: pytest -q tests/test_teacher_rank_provenance_verifier.py

  m3-8-gate:
    name: M3.8 persisted teacher rank provenance integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank_decision_integrity.py tests/test_teacher_rank_decision_integrity.py
      - run: pytest -q tests/test_teacher_rank_decision_integrity.py

  m3-9-gate:
    name: M3.9 authoritative master-data integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/masterdata/authoritative.py tests/test_authoritative_master_data_integrity.py
      - run: pytest -q tests/test_authoritative_master_data_integrity.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
