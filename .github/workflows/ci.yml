name: Morva CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: morva
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: alembic upgrade head
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
      - run: pytest -q
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva
          MORVA_ENV: test
      - run: python -m pip install pip-audit
      - run: pip-audit

  m2-gate:
    name: M2 payroll calculation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/payroll src/morva/integrations tests/golden tests/test_three_way_reconciliation.py tests/test_payroll_contract.py
      - run: pytest -q tests/golden/test_m2_end_to_end.py tests/test_three_way_reconciliation.py tests/test_payroll_contract.py

  m3-gate:
    name: M3 authoritative master-data gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/masterdata src/morva/personnel src/morva/api/v1/assignment_attendance.py tests/test_m3_2_assignment_attendance.py
      - run: pytest -q tests/test_masterdata_validation.py tests/test_masterdata_acceptance.py tests/test_m3_2_assignment_attendance.py

  m3-4-gate:
    name: M3.4 teacher rank evidence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank.py src/morva/hr/teacher_rank_evidence.py tests/test_teacher_rank_evidence.py
      - run: pytest -q tests/test_teacher_rank_evidence.py

  m3-5-gate:
    name: M3.5 teacher rank decision SoD gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank.py tests/test_teacher_rank_decision_sod.py
      - run: pytest -q tests/test_teacher_rank_decision_sod.py

  m3-6-gate:
    name: M3.6 teacher rank decision provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank.py src/morva/hr/teacher_rank_decision_provenance.py tests/test_teacher_rank_decision_provenance.py
      - run: pytest -q tests/test_teacher_rank_decision_provenance.py

  m3-7-gate:
    name: M3.7 teacher rank provenance verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank_provenance_verifier.py tests/test_teacher_rank_provenance_verifier.py
      - run: pytest -q tests/test_teacher_rank_provenance_verifier.py

  m3-8-gate:
    name: M3.8 persisted teacher rank provenance integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/hr/teacher_rank_decision_integrity.py tests/test_teacher_rank_decision_integrity.py
      - run: pytest -q tests/test_teacher_rank_decision_integrity.py

  m3-9-gate:
    name: M3.9 authoritative master-data integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/masterdata/authoritative.py tests/test_authoritative_master_data_integrity.py
      - run: pytest -q tests/test_authoritative_master_data_integrity.py

  m3-10-gate:
    name: M3.10 personnel order lifecycle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/personnel/order_approval.py src/morva/personnel/order_registry.py tests/test_personnel_order_lifecycle_m3_10.py
      - run: pytest -q tests/test_personnel_order_lifecycle_m3_10.py

  m3-11-gate:
    name: M3.11 legal component matrix gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/rules/rule_pack_1405.py tests/test_legal_component_matrix_1405.py
      - run: pytest -q tests/test_legal_component_matrix_1405.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
