name: M4.55 M4.54 Verification Receipt Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-55-m4-54-verification-receipt-persistence.yml"
      - "alembic/versions/0041_independent_m4_53_verification_receipts_m4_55.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/persistence/independent_historical_m4_53_receipt_history_verification_m4_55.py"
      - "src/morva/runtime/independent_historical_m4_53_receipt_history_verifier_m4_54.py"
      - "tests/test_independent_historical_m4_53_receipt_history_verification_m4_55.py"
      - "tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-55-m4-54-verification-receipt-persistence.yml"
      - "alembic/versions/0041_independent_m4_53_verification_receipts_m4_55.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_52_verification_receipt_history_integrity_m4_53.py"
      - "src/morva/persistence/independent_historical_verification_receipt_history_integrity_m4_52.py"
      - "src/morva/runtime/independent_historical_m4_53_receipt_history_verifier_m4_54.py"
      - "tests/test_independent_historical_m4_53_receipt_history_verification_m4_55.py"
      - "tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.55-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-54-verification-receipt-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_53_receipt_history_verification_m4_55.py
          src/morva/runtime/independent_historical_m4_53_receipt_history_verifier_m4_54.py
          tests/test_independent_historical_m4_53_receipt_history_verification_m4_55.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_53_receipt_history_verification_m4_55.py
          tests/test_historical_m4_52_verification_receipt_history_integrity_m4_53.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_55.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.55 persists independent M4.54 verification results as append-only, fingerprint-idempotent receipts over M4.53 snapshots." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
