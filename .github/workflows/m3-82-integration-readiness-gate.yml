name: M3.82 Integration Readiness Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: Verify integration readiness evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >
          ruff check
          src/morva/runtime/integration_readiness_gate.py
          src/morva/runtime/independent_adapter_activation_verifier.py
          src/morva/runtime/independent_integration_contract_verifier.py
          tests/test_integration_readiness_gate_m3_82.py
      - run: pytest -q tests/test_integration_readiness_gate_m3_82.py
      - name: Record production boundary
        run: |
          echo "M3.82 is an integration-readiness evidence gate for staging/pilot only." >> "$GITHUB_STEP_SUMMARY"
