name: Legal Component Engine Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Legal component engine regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/rules/engine.py tests/test_legal_component_engine_regression.py
      - run: pytest -q tests/test_legal_component_engine_regression.py
