name: Local Backend Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend security regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MORVA_LOCAL_ADMIN_EMAIL: e2e-admin@example.invalid
      MORVA_LOCAL_ADMIN_PASSWORD: e2e-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check index.js
      - run: node security-check.js
      - run: npm test
