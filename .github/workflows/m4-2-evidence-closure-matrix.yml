name: M4.2 Evidence Closure Matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-2-evidence-closure-matrix.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/evidence_closure_matrix.py"
      - "tests/test_authoritative_evidence_intake_m4_1.py"
      - "tests/test_evidence_closure_matrix_m4_2.py"
      - "docs/M4_2_EVIDENCE_CLOSURE_MATRIX.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-2-evidence-closure-matrix.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/evidence_closure_matrix.py"
      - "tests/test_authoritative_evidence_intake_m4_1.py"
      - "tests/test_evidence_closure_matrix_m4_2.py"
      - "docs/M4_2_EVIDENCE_CLOSURE_MATRIX.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/authoritative_evidence_intake.py
          src/morva/runtime/evidence_closure_matrix.py
          tests/test_authoritative_evidence_intake_m4_1.py
          tests/test_evidence_closure_matrix_m4_2.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_authoritative_evidence_intake_m4_1.py
          tests/test_evidence_closure_matrix_m4_2.py
      - name: Boundary
        run: |
          echo "M4.2 is a closure-assessment contract only." >> "$GITHUB_STEP_SUMMARY"
          echo "No external authority or production activation is performed." >> "$GITHUB_STEP_SUMMARY"
