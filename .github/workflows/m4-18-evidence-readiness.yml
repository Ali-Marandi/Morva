name: M4.18 Evidence Readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-18-evidence-readiness.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_readiness.py"
      - "src/morva/runtime/evidence_convergence.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "tests/test_evidence_readiness_m4_18.py"
      - "tests/test_evidence_readiness_api_m4_18.py"
      - "docs/M4_18_EVIDENCE_READINESS.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-18-evidence-readiness.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_readiness.py"
      - "src/morva/runtime/evidence_convergence.py"
      - "src/morva/runtime/evidence_lifecycle.py"
      - "src/morva/persistence/evidence_role_binding_records.py"
      - "src/morva/persistence/evidence_lifecycle_records.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "tests/test_evidence_readiness_m4_18.py"
      - "tests/test_evidence_readiness_api_m4_18.py"
      - "docs/M4_18_EVIDENCE_READINESS.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/evidence_submissions.py
          src/morva/runtime/evidence_readiness.py
          src/morva/runtime/evidence_convergence.py
          src/morva/runtime/evidence_lifecycle.py
          src/morva/persistence/evidence_role_binding_records.py
          src/morva/persistence/evidence_lifecycle_records.py
          tests/test_evidence_readiness_m4_18.py
          tests/test_evidence_readiness_api_m4_18.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_readiness_m4_18.py
          tests/test_evidence_readiness_api_m4_18.py
          tests/test_evidence_role_binding_m4_17.py
          tests/test_evidence_lifecycle_m4_15.py
          tests/test_evidence_lifecycle_persistence_m4_16.py
      - name: Migration
        run: alembic upgrade head
