name: M3.70 Production Release Lineage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m3-70-production-release-lineage.yml"
      - "src/morva/runtime/production_release_lineage.py"
      - "tests/test_production_release_lineage_m3_70.py"
      - "tools/m3_70_production_release_lineage.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-70-production-release-lineage.yml"
      - "src/morva/runtime/production_release_lineage.py"
      - "tests/test_production_release_lineage_m3_70.py"
      - "tools/m3_70_production_release_lineage.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lineage:
    name: Validate production release lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/production_release_lineage.py
          tools/m3_70_production_release_lineage.py
          tests/test_production_release_lineage_m3_70.py
      - name: Pytest
        run: >
          pytest -q tests/test_production_release_lineage_m3_70.py
      - name: Record production boundary
        run: |
          echo "M3.70 is a lineage manifest only." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not certify, promote or deploy production." >> "$GITHUB_STEP_SUMMARY"
