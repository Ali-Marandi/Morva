name: M3.17 Personnel Order Lifecycle Gate

on:
  push:
    branches: [main]
    paths:
      - "src/morva/personnel/order_integrity.py"
      - "src/morva/personnel/order_registry.py"
      - "src/morva/personnel/order_approval.py"
      - "src/morva/persistence/models.py"
      - "src/morva/persistence/approval_records.py"
      - "alembic/versions/0017_personnel_order_integrity.py"
      - "tests/test_personnel_order_lifecycle_m3_10.py"
      - "docs/M3_17_PERSONNEL_ORDER_LIFECYCLE.md"
  pull_request:
    paths:
      - "src/morva/personnel/order_integrity.py"
      - "src/morva/personnel/order_registry.py"
      - "src/morva/personnel/order_approval.py"
      - "src/morva/persistence/models.py"
      - "src/morva/persistence/approval_records.py"
      - "alembic/versions/0017_personnel_order_integrity.py"
      - "tests/test_personnel_order_lifecycle_m3_10.py"
      - "docs/M3_17_PERSONNEL_ORDER_LIFECYCLE.md"

jobs:
  personnel-order-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint personnel order lifecycle
        run: ruff check src/morva/personnel/order_integrity.py src/morva/personnel/order_registry.py src/morva/personnel/order_approval.py tests/test_personnel_order_lifecycle_m3_10.py
      - name: Run personnel order lifecycle tests
        run: pytest -q tests/test_personnel_order_lifecycle_m3_10.py
      - name: Compile application
        run: python -m compileall -q src tests
