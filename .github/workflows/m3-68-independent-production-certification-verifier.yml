name: M3.68 Independent Production Certification Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Verify production certification independently
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_certification_verifier.py
          src/morva/runtime/production_certification_gate.py
          src/morva/runtime/external_certification_evidence.py
          src/morva/runtime/final_readiness_verifier.py
          tools/m3_68_independent_certification_verifier.py
          tests/test_independent_certification_verifier_m3_68.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_certification_verifier_m3_68.py
          tests/test_production_certification_gate_m3_67.py
          tests/test_external_certification_evidence_m3_66.py
      - name: Confirm no production mutation
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|'
          pattern+='helm (install|upgrade|rollback)|terraform (apply|destroy)|'
          pattern+='gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden production mutation found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.68 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "Real production certification remains external." >> "$GITHUB_STEP_SUMMARY"
