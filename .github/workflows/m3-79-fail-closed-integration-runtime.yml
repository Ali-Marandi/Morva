name: M3.79 Fail-Closed Integration Adapter Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Verify integration runtime activation boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >
          ruff check
          src/morva/integrations/ports.py
          src/morva/runtime/official_adapter_evidence.py
          src/morva/runtime/independent_adapter_activation_verifier.py
          src/morva/runtime/integration_adapter_runtime.py
          tests/test_integration_adapter_runtime_m3_79.py
      - run: pytest -q tests/test_integration_adapter_runtime_m3_79.py
      - name: Record production boundary
        run: |
          echo "M3.79 keeps integration fail-closed until independently verified adapter activation exists." >> "$GITHUB_STEP_SUMMARY"
          echo "No provider network connection or credential activation is performed by CI." >> "$GITHUB_STEP_SUMMARY"
