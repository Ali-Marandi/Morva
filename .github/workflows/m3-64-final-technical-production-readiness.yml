name: M3.64 Final Technical Production Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-readiness:
    name: Verify final technical readiness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/final_production_readiness.py
          src/morva/runtime/technical_readiness_gate.py
          src/morva/runtime/evidence_freshness_gate.py
          tools/m3_64_final_production_readiness.py
          tests/test_final_production_readiness_m3_64.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_final_production_readiness_m3_64.py
          tests/test_technical_readiness_gate_m3_62.py
          tests/test_evidence_freshness_gate_m3_63.py
      - name: Confirm no production mutation
        shell: bash
        run: |
          pattern='^[[:space:]]*(kubectl (apply|delete)|'
          pattern+='helm (install|upgrade|rollback)|terraform (apply|destroy)|'
          pattern+='gh release (create|edit|delete|upload)|git (push|tag) )'
          for file in .github/workflows/*; do
            [ -f "$file" ] || continue
            if grep -InE -- "$pattern" "$file"; then
              echo "forbidden production mutation found"
              exit 1
            fi
          done
      - name: Record production boundary
        run: |
          echo "M3.64 is the final software readiness gate only." >> "$GITHUB_STEP_SUMMARY"
          echo "External certification and real production promotion remain separate." >> "$GITHUB_STEP_SUMMARY"
