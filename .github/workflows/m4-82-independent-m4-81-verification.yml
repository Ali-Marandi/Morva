name: M4.82 Independent M4.81 Verification

on:
  pull_request:
    branches:
      - main
      - feat/m4-73-m4-72-independent-verification
    paths:
      - ".github/workflows/m4-82-independent-m4-81-verification.yml"
      - "src/morva/runtime/independent_m4_79_verification_receipt_m4_82.py"
      - "src/morva/persistence/independent_m4_79_verification_receipts_m4_81.py"
      - "src/morva/persistence/independent_m4_77_verification_receipts_m4_79.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "tests/test_independent_m4_79_verification_receipts_m4_81.py"
      - "tests/test_independent_m4_79_verification_receipt_m4_82.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.82-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_m4_79_verification_receipt_m4_82.py
          tests/test_independent_m4_79_verification_receipt_m4_82.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_m4_79_verification_receipts_m4_81.py
          tests/test_independent_m4_79_verification_receipt_m4_82.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_82.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.82 independently reconstructs and verifies persisted M4.81 results through M4.80 -> M4.79 -> M4.77 point-in-time evidence." >> "\${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "\${GITHUB_STEP_SUMMARY}"
