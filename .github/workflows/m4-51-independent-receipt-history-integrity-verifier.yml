name: M4.51 Independent Historical Verification Receipt History Integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-51-independent-receipt-history-integrity-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/runtime/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py"
      - "tests/test_historical_independent_verification_receipt_history_integrity_m4_50.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-51-independent-receipt-history-integrity-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/runtime/historical_independent_verification_receipt_history_integrity_m4_50.py"
      - "src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py"
      - "tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py"
      - "tests/test_historical_independent_verification_receipt_history_integrity_m4_50.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-receipt-history-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_verification_receipt_history_integrity_verifier_m4_51.py
          tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_verification_receipt_history_integrity_m4_51.py
          tests/test_historical_independent_verification_receipt_history_integrity_m4_50.py
      - name: Boundary
        run: |
          echo "M4.51 independently reconstructs the point-in-time M4.49 receipt history behind each M4.50 snapshot." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
