name: M3.71 Independent Production Release Lineage Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Independently verify release lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/independent_release_lineage_verifier.py
          src/morva/runtime/production_release_lineage.py
          src/morva/runtime/final_readiness_verifier.py
          src/morva/runtime/production_certification_gate.py
          tools/m3_71_independent_release_lineage_verifier.py
          tests/test_independent_release_lineage_verifier_m3_71.py
      - name: Pytest
        run: >
          pytest -q tests/test_independent_release_lineage_verifier_m3_71.py
      - name: Record production boundary
        run: |
          echo "M3.71 is verification-only." >> "$GITHUB_STEP_SUMMARY"
          echo "No production certification or deployment is performed." >> "$GITHUB_STEP_SUMMARY"
