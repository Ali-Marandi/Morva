name: M3.36 security assessment preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-preflight:
    name: Independent assessment readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/runtime/security_assessment.py tests/test_security_assessment_m3_36.py tools/m3_36_security_preflight.py
      - run: pytest -q tests/test_security_assessment_m3_36.py
      - run: python tools/m3_36_security_preflight.py
