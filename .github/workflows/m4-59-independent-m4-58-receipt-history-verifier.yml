name: M4.59 Independent M4.58 Receipt-History Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-59-independent-m4-58-receipt-history-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/persistence/independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
      - "src/morva/runtime/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/runtime/independent_historical_m4_58_receipt_history_verifier_m4_59.py"
      - "tests/test_independent_historical_m4_58_receipt_history_verifier_m4_59.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-59-independent-m4-58-receipt-history-verifier.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/persistence/independent_historical_m4_56_receipt_verification_persistence_m4_57.py"
      - "src/morva/runtime/historical_m4_57_verification_receipt_history_integrity_m4_58.py"
      - "src/morva/runtime/independent_historical_m4_58_receipt_history_verifier_m4_59.py"
      - "tests/test_independent_historical_m4_58_receipt_history_verifier_m4_59.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.59-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-m4-58-receipt-history-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/independent_historical_m4_58_receipt_history_verifier_m4_59.py
          tests/test_independent_historical_m4_58_receipt_history_verifier_m4_59.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_m4_58_receipt_history_verifier_m4_59.py
          tests/test_historical_m4_57_verification_receipt_history_integrity_m4_58.py
      - name: Boundary
        run: |
          echo "M4.59 independently reconstructs the point-in-time M4.57 receipt history behind each M4.58 snapshot." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
