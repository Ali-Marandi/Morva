name: M4.4 Master Data Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-4-masterdata-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/masterdata/acceptance.py"
      - "src/morva/runtime/masterdata_evidence_bridge.py"
      - "tests/test_masterdata_evidence_bridge_m4_4.py"
      - "docs/M4_4_MASTERDATA_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-4-masterdata-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/masterdata/acceptance.py"
      - "src/morva/runtime/masterdata_evidence_bridge.py"
      - "tests/test_masterdata_evidence_bridge_m4_4.py"
      - "docs/M4_4_MASTERDATA_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/masterdata_evidence_bridge.py
          tests/test_masterdata_evidence_bridge_m4_4.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_masterdata_evidence_bridge_m4_4.py
      - name: Boundary
        run: |
          echo "M4.4 binds external master-data evidence to internally accepted data only." >> "$GITHUB_STEP_SUMMARY"
          echo "No employee records or real authoritative data are committed." >> "$GITHUB_STEP_SUMMARY"
