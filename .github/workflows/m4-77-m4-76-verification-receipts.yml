name: M4.77 M4.76 Independent Verification Receipt Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-77-m4-76-verification-receipts.yml"
      - "alembic/versions/0055_independent_m4_75_verification_receipts_m4_77.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py"
      - "src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_independent_historical_m4_75_verification_receipts_m4_77.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-77-m4-76-verification-receipts.yml"
      - "alembic/versions/0055_independent_m4_75_verification_receipts_m4_77.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/database.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py"
      - "src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py"
      - "tests/test_independent_historical_m4_75_verification_receipts_m4_77.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.77-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py
          src/morva/runtime/independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py
          tests/test_independent_historical_m4_75_verification_receipts_m4_77.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_m4_74_verification_receipt_history_integrity_m4_75.py
          tests/test_independent_historical_m4_74_verification_receipt_history_integrity_m4_76.py
          tests/test_independent_historical_m4_75_verification_receipts_m4_77.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_77.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.77 persists M4.76 independent verification results as append-only, fingerprint-idempotent receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
