name: M4.6 Adapter Contract Evidence Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-6-adapter-contract-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/official_adapter_evidence.py"
      - "src/morva/runtime/adapter_contract_evidence_bridge.py"
      - "tests/test_adapter_contract_evidence_bridge_m4_6.py"
      - "docs/M4_6_ADAPTER_CONTRACT_EVIDENCE_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-6-adapter-contract-evidence-bridge.yml"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "src/morva/runtime/official_adapter_evidence.py"
      - "src/morva/runtime/adapter_contract_evidence_bridge.py"
      - "tests/test_adapter_contract_evidence_bridge_m4_6.py"
      - "docs/M4_6_ADAPTER_CONTRACT_EVIDENCE_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/adapter_contract_evidence_bridge.py
          tests/test_adapter_contract_evidence_bridge_m4_6.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_adapter_contract_evidence_bridge_m4_6.py
      - name: Boundary
        run: |
          echo "M4.6 binds official adapter evidence to accepted adapter-contract evidence only." >> "$GITHUB_STEP_SUMMARY"
          echo "No provider endpoint activation, credential use or production mutation is introduced." >> "$GITHUB_STEP_SUMMARY"
