name: M4.80 Independent M4.79 Receipt Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-80-independent-m4-79-verification.yml"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/m4_80_independent_verification.py"
      - "src/morva/api/v1/m4_79_verification_receipts.py"
      - "src/morva/persistence/independent_m4_77_verification_receipts_m4_79.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_m4_78.py"
      - "src/morva/runtime/independent_m4_77_verification_receipt_m4_80.py"
      - "tests/test_independent_m4_77_verification_receipts_m4_79.py"
      - "tests/test_independent_m4_77_verification_receipt_m4_80.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m4-80-independent-m4-79-verification.yml"
      - "src/morva/api/app.py"
      - "src/morva/api/v1/m4_80_independent_verification.py"
      - "src/morva/api/v1/m4_79_verification_receipts.py"
      - "src/morva/persistence/independent_m4_77_verification_receipts_m4_79.py"
      - "src/morva/persistence/independent_historical_m4_75_verification_receipts_m4_77.py"
      - "src/morva/persistence/historical_m4_74_verification_receipt_history_integrity_m4_75.py"
      - "src/morva/persistence/independent_historical_m4_72_verification_receipts_m4_74.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_m4_78.py"
      - "src/morva/runtime/independent_m4_77_verification_receipt_m4_80.py"
      - "tests/test_independent_m4_77_verification_receipts_m4_79.py"
      - "tests/test_independent_m4_77_verification_receipt_m4_80.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.80-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: morva_test
          POSTGRES_USER: morva
          POSTGRES_PASSWORD: morva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morva -d morva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Full test suite (PostgreSQL)
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva_test
        run: pytest -q
      - name: Create isolated PostgreSQL migration database
        env:
          PGPASSWORD: morva
        run: createdb -h localhost -U morva -p 5432 morva_migration_test
      - name: PostgreSQL migration
        env:
          MORVA_DATABASE_URL: postgresql+psycopg://morva:morva@localhost:5432/morva_migration_test
        run: alembic upgrade head
      - name: SQLite migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_80.db
        run: alembic upgrade head
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Dependency audit
        run: pip-audit
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Web type check
        run: npm run type-check --prefix web
      - name: Web production build
        run: npm run build --prefix web
      - name: Safety boundary
        run: |
          echo "M4.80 independently reconstructs M4.79 verification receipts." >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only verification metadata; no provider execution, credentials, payment mutation or production authorization." >> "$GITHUB_STEP_SUMMARY"
