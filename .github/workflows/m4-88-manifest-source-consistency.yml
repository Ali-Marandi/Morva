name: M4.88 Manifest Source Consistency

on:
  pull_request:
    branches:
      - main
    paths:
      - "contracts/historical_integrity_manifest_m4_86.json"
      - "tests/test_historical_integrity_manifest_source_consistency_m4_88.py"
      - "tests/test_historical_integrity_graph_m4_87.py"
      - "tests/test_historical_integrity_contract_m4_85.py"
      - "tests/test_historical_integrity_manifest_m4_86.py"
      - ".github/workflows/m4-88-manifest-source-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: M4.88-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check tests/test_historical_integrity_manifest_source_consistency_m4_88.py
      - name: Manifest source consistency
        run: >-
          pytest -q
          tests/test_historical_integrity_manifest_source_consistency_m4_88.py
          tests/test_historical_integrity_graph_m4_87.py
          tests/test_historical_integrity_contract_m4_85.py
          tests/test_historical_integrity_manifest_m4_86.py
      - name: Boundary
        run: |
          echo "M4.88 enforces that the machine-readable integrity manifest matches the guarded source and test imports." >> "$GITHUB_STEP_SUMMARY"
          echo "No runtime semantics, persistence schema, API contract or production authority changes." >> "$GITHUB_STEP_SUMMARY"
