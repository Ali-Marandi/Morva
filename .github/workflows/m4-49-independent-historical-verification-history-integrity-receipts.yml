name: M4.49 Independent Historical Verification History Integrity Receipts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-49-independent-historical-verification-history-integrity-receipts.yml"
      - "alembic/versions/0037_independent_historical_freshness_verification_history_integrity_receipts.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_freshness_verification_history_integrity_m4_47.py"
      - "src/morva/persistence/independent_historical_freshness_receipt_verifications_m4_46.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/runtime/independent_historical_freshness_verification_history_integrity_verifier_m4_48.py"
      - "tests/test_independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "tests/test_independent_historical_freshness_verification_history_integrity_m4_48.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-49-independent-historical-verification-history-integrity-receipts.yml"
      - "alembic/versions/0037_independent_historical_freshness_verification_history_integrity_receipts.py"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_freshness_verification_history_integrity_m4_47.py"
      - "src/morva/persistence/independent_historical_freshness_receipt_verifications_m4_46.py"
      - "src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "src/morva/runtime/independent_historical_freshness_verification_history_integrity_verifier_m4_48.py"
      - "tests/test_independent_historical_freshness_verification_history_integrity_receipts_m4_49.py"
      - "tests/test_independent_historical_freshness_verification_history_integrity_m4_48.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/persistence/independent_historical_freshness_verification_history_integrity_receipts_m4_49.py
          src/morva/runtime/independent_historical_freshness_verification_history_integrity_verifier_m4_48.py
          tests/test_independent_historical_freshness_verification_history_integrity_receipts_m4_49.py
          tests/test_independent_historical_freshness_verification_history_integrity_m4_48.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_independent_historical_freshness_verification_history_integrity_receipts_m4_49.py
          tests/test_independent_historical_freshness_verification_history_integrity_m4_48.py
          tests/test_historical_freshness_verification_history_integrity_m4_47.py
          tests/test_independent_historical_freshness_receipt_verifications_m4_46.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_49.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.49 persists independent M4.48 history-integrity verification results with point-in-time M4.46 reconstruction." >> "${GITHUB_STEP_SUMMARY}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${GITHUB_STEP_SUMMARY}"
