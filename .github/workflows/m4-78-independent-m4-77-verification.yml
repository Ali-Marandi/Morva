name: M4.78 Independent M4.77 History-Integrity Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-78-independent-m4-77-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/historical_integrity_primitives.py"
      - "src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
      - "tests/test_historical_integrity_primitives.py"
      - "tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-78-independent-m4-77-verification.yml"
      - "src/morva/api/v1/integration_execution_readiness.py"
      - "src/morva/persistence/historical_m4_72_verification_receipt_m4_75.py"
      - "src/morva/persistence/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
      - "tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py"
      - "tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/api/v1/integration_execution_readiness.py
          src/morva/runtime/historical_integrity_primitives.py
          src/morva/runtime/independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py
          tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_historical_integrity_primitives.py
          tests/test_historical_m4_75_verification_receipt_history_integrity_m4_77.py
          tests/test_independent_historical_m4_75_verification_receipt_history_integrity_m4_78.py
      - name: Migration
        env:
          MORVA_DATABASE_URL: sqlite:///./m4_78.db
        run: alembic upgrade head
      - name: Boundary
        run: |
          echo "M4.78 independently verifies M4.77 snapshots against point-in-time M4.76 result history." >> "${{GITHUB_STEP_SUMMARY}}"
          echo "Verification-only; no provider execution, credentials, payment mutation or production authorization." >> "${{GITHUB_STEP_SUMMARY}}"
