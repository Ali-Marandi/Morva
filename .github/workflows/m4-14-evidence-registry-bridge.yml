name: M4.14 Evidence Registry Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-14-evidence-registry-bridge.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_evidence_registry_bridge_m4_14.py"
      - "tests/test_evidence_submission_service_m4_13.py"
      - "docs/M4_14_EVIDENCE_REGISTRY_BRIDGE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-14-evidence-registry-bridge.yml"
      - "src/morva/api/v1/evidence_submissions.py"
      - "src/morva/runtime/evidence_registry_bridge.py"
      - "src/morva/runtime/evidence_submission.py"
      - "src/morva/persistence/evidence_submission_records.py"
      - "src/morva/runtime/authoritative_evidence_intake.py"
      - "tests/test_evidence_registry_bridge_m4_14.py"
      - "tests/test_evidence_submission_service_m4_13.py"
      - "docs/M4_14_EVIDENCE_REGISTRY_BRIDGE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: >
          ruff check
          src/morva/runtime/evidence_registry_bridge.py
          src/morva/api/v1/evidence_submissions.py
          tests/test_evidence_registry_bridge_m4_14.py
      - name: Pytest
        run: >
          pytest -q
          tests/test_evidence_registry_bridge_m4_14.py
          tests/test_evidence_submission_service_m4_13.py
      - name: Migration
        run: alembic upgrade head
