name: M3.32 Payment Settlement Hard-Stop Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  m3-32-payment-settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/morva/payroll/payment_settlement.py tests/test_payment_settlement_m3_32.py
      - run: pytest -q tests/test_payment_settlement_m3_32.py tests/test_payment_exception_api_m3_31.py
