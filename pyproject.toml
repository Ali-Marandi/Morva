[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morva-payroll"
version = "1.0.0rc1"
description = "Morva Payroll Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "cryptography>=43,<47",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.8.6", "hypothesis>=6", "pytest-cov>=5"]

[project.scripts]
morva = "morva.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
