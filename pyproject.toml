[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morva-beam"
version = "0.1.0"
description = "Dependency-free preliminary analysis of simply supported beams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Marandi" }]
keywords = ["structural-engineering", "beam", "statics", "civil-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
morva = "morva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
